# Configurazione deploy Netlify per SANDR.
# Staging: preview automatico su branch. Produzione: deploy MANUALE (vedi CLAUDE.md).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Plugin ufficiale Next.js per Netlify (App Router, middleware, SSR)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# I deploy in produzione richiedono approvazione del founder:
# il deploy automatico su "production" è disabilitato di proposito.
# Contenuti dimostrativi (dirette/interviste di prova): ACCESI in preview e
# branch-deploy, SPENTI in produzione.
[context.production]
  # Configurare manualmente da dashboard Netlify al momento del rilascio.
  [context.production.environment]
    NEXT_PUBLIC_DEMO_CONTENT = "false"

[context.deploy-preview]
  command = "npm run build"
  [context.deploy-preview.environment]
    NEXT_PUBLIC_DEMO_CONTENT = "true"

[context.branch-deploy]
  command = "npm run build"
  [context.branch-deploy.environment]
    NEXT_PUBLIC_DEMO_CONTENT = "true"
